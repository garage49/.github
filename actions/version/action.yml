# Computes the build's version by the garage49 rules (RULES.md). The one place versions are decided.
#   tag vX.Y.Z  -> release X.Y.Z; fails unless the tag equals the declared version and is on main
#   otherwise   -> snapshot X.Y.(Z+1)-dev.N+g<sha> after the last release tag vX.Y.Z (N = commits
#                  since it); before any release: <declared>-dev.N+g<sha> (N = all commits)
# Used as garage49/.github/actions/version@main. Needs a checkout with full history and tags (fetch-depth: 0).
name: version
description: garage49 release/snapshot version
inputs:
  declared:
    description: version declared in the project's own version file (Cargo.toml, package.json)
    required: true
outputs:
  version:
    description: SemVer version (snapshot carries +g<sha> build metadata)
    value: ${{ steps.v.outputs.version }}
  image-tag:
    description: docker tag form of the version ('+' is not allowed in docker tags, becomes '-')
    value: ${{ steps.v.outputs.image-tag }}
  release:
    description: "'true' for a release tag build"
    value: ${{ steps.v.outputs.release }}
runs:
  using: composite
  steps:
    - id: v
      shell: bash
      env:
        DECLARED: ${{ inputs.declared }}
      run: |
        set -euo pipefail
        semver='^[0-9]+\.[0-9]+\.[0-9]+$'
        sha=$(git rev-parse --short=7 HEAD)
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          v=${GITHUB_REF#refs/tags/v}
          [[ "$v" =~ $semver ]] || { echo "::error::release tag must be vX.Y.Z, got v$v"; exit 1; }
          [[ "$v" == "$DECLARED" ]] || { echo "::error::tag v$v != declared version $DECLARED; bump the version file first"; exit 1; }
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::tag v$v is not on main; release tags go on main commits only"; exit 1; }
          version=$v image=$v release=true
        else
          if last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null) && [[ "${last#v}" =~ $semver ]]; then
            IFS=. read -r a b c <<<"${last#v}"
            next="$a.$b.$((c + 1))"; n=$(git rev-list --count "$last..HEAD")
          else
            [[ "$DECLARED" =~ $semver ]] || { echo "::error::declared version '$DECLARED' is not X.Y.Z"; exit 1; }
            next=$DECLARED; n=$(git rev-list --count HEAD)
          fi
          version="$next-dev.$n+g$sha" image="$next-dev.$n-g$sha" release=false
        fi
        echo "version=$version" >>"$GITHUB_OUTPUT"
        echo "image-tag=$image" >>"$GITHUB_OUTPUT"
        echo "release=$release" >>"$GITHUB_OUTPUT"
        echo "### version $version (release=$release, image tag $image)" >>"$GITHUB_STEP_SUMMARY"

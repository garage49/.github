# Shared build for Rust programs on the garage49 build farm (rules: RULES.md in this repository).
# A repository calls it from its own .github/workflows/build.yml:
#
#   on: { push: { branches: [main], tags: ['v*'] }, pull_request: {}, workflow_dispatch: {} }
#   permissions: { contents: write }
#   jobs:
#     build:
#       uses: garage49/.github/.github/workflows/rust-build.yml@main
#       with: { name: herdr-ranch, package: herdr-ranch, targets: '["linux-x86_64","macos-aarch64"]' }
#
# main push -> test + build every target, workflow artifacts (snapshot version)
# pull request -> test + build, nothing published
# tag vX.Y.Z -> the same, then a GitHub Release with <name>-<os>-<arch> assets, <asset>.sha256 and SHA256SUMS
# crates set -> on a release tag, cargo publish to crates.io with trusted publishing (OIDC, GitHub-hosted
#   runner, no token; the crate must first be reserved by the Owner, build-chain's crates-bootstrap.sh)
# targets '[]' -> a library: version check, test (and clippy) only; no binaries, no release assets
# docker-image set -> image built on build-linux and pushed to the internal registry (the farm
#   machine's environment variable INTERNAL_DOCKER_REGISTRY)
#   (main: <snapshot tag>; release: X.Y.Z, plus latest when docker-latest)
name: rust-build
on:
  workflow_call:
    inputs:
      name:
        description: asset base name, <name>-<os>-<arch>
        type: string
        required: true
      package:
        description: cargo package to build (-p) and whose version is the declared version
        type: string
        required: true
      bin:
        description: binary name inside the package (default = package)
        type: string
        default: ''
      targets:
        description: JSON list from linux-x86_64, macos-aarch64, macos-x86_64, windows-x86_64; '[]' for a library (test only, no assets)
        type: string
        default: '["linux-x86_64","macos-aarch64","macos-x86_64"]'
      path:
        description: directory of the Cargo workspace inside the repository
        type: string
        default: '.'
      version-files:
        description: more files whose top-level version must equal the declared one (space-separated; .toml or .json)
        type: string
        default: ''
      prebuild:
        description: shell command run once in a node container before every cargo build/test (e.g. a web bundle)
        type: string
        default: ''
      prebuild-path:
        description: directory the prebuild produces, handed to every build and test job
        type: string
        default: ''
      test:
        description: run cargo test --workspace on Linux
        type: boolean
        default: true
      clippy:
        description: also run cargo clippy --workspace --all-targets in the test job; its exit status is a gate (deny lints in Cargo.toml)
        type: boolean
        default: false
      crates:
        description: JSON list of crates to publish to crates.io on a release tag, in publish order (dependencies first); public repositories only
        type: string
        default: '[]'
      docker-image:
        description: image name in the internal registry, built from <path>/Dockerfile; empty = none
        type: string
        default: ''
      docker-latest:
        description: also tag a release image latest (only for Keel-deployed services)
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.version.outputs.version }}

env:
  CARGO_TERM_COLOR: always

# Runner choice (RULES.md): a pull request of a PUBLIC repository never runs on the build farm; it
# uses GitHub-hosted runners. Every other build uses the farm (labels linux-build, macos-build,
# windows-build).

jobs:
  version:
    runs-on: ${{ (github.event_name == 'pull_request' && !github.event.repository.private) && 'ubuntu-latest' || fromJSON('["self-hosted","linux-build"]') }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      image-tag: ${{ steps.v.outputs.image-tag }}
      release: ${{ steps.v.outputs.release }}
      native: ${{ steps.t.outputs.native }}
      linux: ${{ steps.t.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: d
        run: |
          v=$(cargo metadata --no-deps --format-version 1 --manifest-path "${{ inputs.path }}/Cargo.toml" | jq -r --arg p "${{ inputs.package }}" '.packages[] | select(.name == $p) | .version')
          [ -n "$v" ] || { echo "::error::package ${{ inputs.package }} not found"; exit 1; }
          for f in ${{ inputs.version-files }}; do
            case "$f" in
              *.json) w=$(jq -r .version "$f") ;;
              *.toml) w=$(sed -n 's/^version *= *"\(.*\)".*/\1/p' "$f" | head -1) ;;
              *) echo "::error::version file $f: only .toml or .json"; exit 1 ;;
            esac
            [ "$w" = "$v" ] || { echo "::error::$f says version $w, ${{ inputs.package }} says $v; they must match"; exit 1; }
          done
          echo "declared=$v" >>"$GITHUB_OUTPUT"
      - id: v
        uses: garage49/.github/actions/version@main
        with: { declared: '${{ steps.d.outputs.declared }}' }
      - id: t
        env:
          TARGETS: '${{ inputs.targets }}'
          HOSTED: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
        run: |
          # one table: target -> farm label, GitHub-hosted image (public pull requests), rust triple, extension
          map='{"macos-aarch64":{"label":"macos-build","hosted":"macos-15","triple":"aarch64-apple-darwin","ext":""},
                "macos-x86_64":{"label":"macos-build","hosted":"macos-15-intel","triple":"x86_64-apple-darwin","ext":""},
                "windows-x86_64":{"label":"windows-build","hosted":"windows-latest","triple":"x86_64-pc-windows-msvc","ext":".exe"}}'
          echo "$TARGETS" | jq -e 'all(. as $t | ["linux-x86_64","macos-aarch64","macos-x86_64","windows-x86_64"] | index($t))' >/dev/null \
            || { echo "::error::unknown target in $TARGETS"; exit 1; }
          echo "native=$(echo "$TARGETS" | jq -c --argjson m "$map" --argjson h "$HOSTED" '[.[] | select(. != "linux-x86_64") | {target: .} + $m[.]
            | . + {"runs-on": (if $h then (.hosted | tojson) else (["self-hosted", .label] | tojson) end)} | del(.label, .hosted)]')" >>"$GITHUB_OUTPUT"
          echo "linux=$(echo "$TARGETS" | jq -c 'index("linux-x86_64") != null')" >>"$GITHUB_OUTPUT"

  prebuild:
    if: inputs.prebuild != ''
    runs-on: ${{ (github.event_name == 'pull_request' && !github.event.repository.private) && 'ubuntu-latest' || fromJSON('["self-hosted","linux-build"]') }}
    container: node:lts-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: ${{ inputs.prebuild }}
      - uses: actions/upload-artifact@v4
        with: { name: prebuild, path: '${{ inputs.prebuild-path }}', retention-days: 1, include-hidden-files: true }

  test:
    needs: prebuild
    if: always() && inputs.test && needs.prebuild.result != 'failure' && needs.prebuild.result != 'cancelled'
    runs-on: ${{ (github.event_name == 'pull_request' && !github.event.repository.private) && 'ubuntu-latest' || fromJSON('["self-hosted","linux-build"]') }}
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - if: inputs.prebuild != ''
        uses: actions/download-artifact@v4
        with: { name: prebuild, path: '${{ inputs.prebuild-path }}' }
      - run: cargo test --workspace --locked
        working-directory: ${{ inputs.path }}
      - if: inputs.clippy
        run: rustup component add clippy && cargo clippy --workspace --all-targets --locked
        working-directory: ${{ inputs.path }}

  linux:
    needs: [version, prebuild]
    if: always() && needs.version.outputs.linux == 'true' && needs.prebuild.result != 'failure' && needs.prebuild.result != 'cancelled'
    runs-on: ${{ (github.event_name == 'pull_request' && !github.event.repository.private) && 'ubuntu-latest' || fromJSON('["self-hosted","linux-build"]') }}
    container: rust:1-bookworm   # glibc 2.36: the oldest we ship to (ranch server)
    steps:
      - uses: actions/checkout@v4
      - if: inputs.prebuild != ''
        uses: actions/download-artifact@v4
        with: { name: prebuild, path: '${{ inputs.prebuild-path }}' }
      - run: |
          bin=${{ inputs.bin || inputs.package }}
          cd "${{ inputs.path }}"
          cargo build --release --locked -p ${{ inputs.package }}
          mkdir -p "$GITHUB_WORKSPACE/dist" && cp "target/release/$bin" "$GITHUB_WORKSPACE/dist/${{ inputs.name }}-linux-x86_64"
      - uses: actions/upload-artifact@v4
        with: { name: '${{ inputs.name }}-linux-x86_64', path: dist/*, retention-days: 7 }

  native:
    needs: [version, prebuild]
    if: always() && needs.version.result == 'success' && needs.version.outputs.native != '[]' && needs.prebuild.result != 'failure' && needs.prebuild.result != 'cancelled'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.version.outputs.native) }}
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    steps:
      - uses: actions/checkout@v4
      - if: inputs.prebuild != ''
        uses: actions/download-artifact@v4
        with: { name: prebuild, path: '${{ inputs.prebuild-path }}' }
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          bin=${{ inputs.bin || inputs.package }}
          rustup target add ${{ matrix.triple }}
          cd "${{ inputs.path }}"
          cargo build --release --locked -p ${{ inputs.package }} --target ${{ matrix.triple }}
          mkdir -p "$GITHUB_WORKSPACE/dist" && cp "target/${{ matrix.triple }}/release/$bin" "$GITHUB_WORKSPACE/dist/${{ inputs.name }}-${{ matrix.target }}"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = '${{ inputs.bin || inputs.package }}'
          Set-Location '${{ inputs.path }}'
          cargo build --release --locked -p ${{ inputs.package }} --target ${{ matrix.triple }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/dist" | Out-Null
          Copy-Item "target/${{ matrix.triple }}/release/$bin.exe" "$env:GITHUB_WORKSPACE/dist/${{ inputs.name }}-${{ matrix.target }}.exe"
      - uses: actions/upload-artifact@v4
        with: { name: '${{ inputs.name }}-${{ matrix.target }}', path: dist/*, retention-days: 7 }

  docker:
    needs: [version, test]
    if: always() && inputs.docker-image != '' && github.event_name != 'pull_request' && needs.version.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: [self-hosted, linux-build]
    steps:
      - uses: actions/checkout@v4
      - env:
          NAME: ${{ inputs.docker-image }}
          TAG: ${{ needs.version.outputs.image-tag }}
          RELEASE: ${{ needs.version.outputs.release }}
          LATEST: ${{ inputs.docker-latest }}
        run: |
          # internal endpoints are set on the farm machines (runner .env), never in this public repo
          IMAGE="${INTERNAL_DOCKER_REGISTRY:?not set on this runner}/$NAME"
          docker build --pull -t "$IMAGE:$TAG" "${{ inputs.path }}"
          docker push "$IMAGE:$TAG"
          if [ "$RELEASE" = true ] && [ "$LATEST" = true ]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest" && docker push "$IMAGE:latest"
          fi
          echo "pushed $IMAGE:$TAG $( [ "$RELEASE" = true ] && [ "$LATEST" = true ] && echo '+ latest')" >>"$GITHUB_STEP_SUMMARY"

  crates:
    needs: [version, test]
    if: always() && inputs.crates != '[]' && needs.version.outputs.release == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest   # crates.io trusted publishing needs GitHub's OIDC token
    permissions: { contents: read, id-token: write }
    steps:
      - if: github.event.repository.private
        run: echo "::error::crates.io is public; a private repository has no crate registry yet (RULES.md)" && exit 1
      - uses: actions/checkout@v4
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: '${{ inputs.crates }}'
          V: ${{ needs.version.outputs.version }}
          UA: garage49-build (github.com/garage49/.github)
        working-directory: ${{ inputs.path }}
        run: |
          set -euo pipefail
          for c in $(echo "$CRATES" | jq -r '.[]'); do
            if curl -fsS -A "$UA" "https://crates.io/api/v1/crates/$c/$V" >/dev/null 2>&1; then
              echo "= $c@$V already published"; continue   # re-run after a partial publish
            fi
            echo "publish $c@$V -> crates.io"
            cargo publish -p "$c" --locked
            # the next crate may depend on this one: wait until crates.io serves it
            ok=
            for wait in 10 10 20 20 30 30 60 60 60 60 120 120; do
              curl -fsS -A "$UA" "https://crates.io/api/v1/crates/$c/$V" >/dev/null 2>&1 && { ok=1; break; }
              sleep "$wait"
            done
            [ -n "$ok" ] || { echo "::error::$c@$V not visible 10 minutes after publish; re-run on the tag to continue"; exit 1; }
          done

  release:
    needs: [version, test, linux, native]
    if: always() && inputs.targets != '[]' && needs.version.outputs.release == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: [self-hosted, linux-build]
    concurrency: release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true, pattern: '${{ inputs.name }}-*' }
      - uses: garage49/.github/actions/release@main
        with: { dir: dist, version: '${{ needs.version.outputs.version }}' }
